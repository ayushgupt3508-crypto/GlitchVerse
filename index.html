<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GlitchVerse</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080c14;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      font-family: 'Pixelify Sans', 'Share Tech Mono', 'Courier New', monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-color: #070b14;
      touch-action: none;
    }

    #game-container canvas {
      display: block;
      touch-action: none;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
    }

    /* ── Mobile Landscape Orientation Barrier ── */
    #landscape-barrier {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: radial-gradient(circle at center, #0e172a 0%, #030712 100%);
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      color: #ffffff;
    }

    body.is-mobile-device.barrier-active #landscape-barrier {
      display: flex;
    }

    .barrier-card {
      background: rgba(14, 23, 42, 0.95);
      border: 2px solid #00f0ff;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .barrier-icon-wrapper {
      width: 72px;
      height: 72px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: rotatePhone 2.5s infinite ease-in-out;
    }

    @keyframes rotatePhone {

      0%,
      15% {
        transform: rotate(0deg);
      }

      45%,
      70% {
        transform: rotate(-90deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }

    .barrier-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #00f0ff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .barrier-desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      font-family: 'Pixelify Sans', sans-serif;
    }

    .barrier-btn {
      background: linear-gradient(135deg, #00f0ff 0%, #0077ff 100%);
      color: #030712;
      border: none;
      padding: 12px 24px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.5);
      touch-action: manipulation;
    }

    .barrier-btn:active {
      transform: scale(0.96);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
    }

    @font-face {
      font-family: 'Pixelify Sans';
      src: url('/assets/fonts/PixelifySans-VariableFont_wght.ttf') format('truetype');
      font-display: swap;
    }

    @font-face {
      font-family: 'Press Start 2P';
      src: url('/assets/fonts/PressStart2P-Regular.ttf') format('truetype');
      font-display: swap;
    }
  </style>
</head>

<body>
  <!-- Orientation Barrier for Portrait Mobile Devices -->
  <div id="landscape-barrier">
    <div class="barrier-card">
      <div class="barrier-icon-wrapper">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#00f0ff" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
          <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
      </div>
      <div class="barrier-title">ROTATE DEVICE</div>
      <div class="barrier-desc">GlitchVerse requires horizontal landscape mode for gameplay.</div>
      <button id="barrier-fullscreen-btn" class="barrier-btn">ENTER LANDSCAPE</button>
    </div>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
